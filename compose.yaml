services:
  mcp:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    shm_size: 1gb
    env_file: .env
    environment:
      HOST: 0.0.0.0
      ADMIN_HOST: 0.0.0.0
      CHROMIUM_PATH: /usr/local/bin/chromium
      # Container-internal ports are fixed; PORT/ADMIN_PORT in .env only choose the host ports.
      PORT: "8787"
      HOST_PORT: ${PORT:-8787}
      ADMIN_PORT: "8788"
      WORKSPACE_ROOTS: ${PROJECTS_DIR:?Set PROJECTS_DIR in .env}
      TUNNEL_METRICS_URL: http://tunnel:2000
      DATA_DIR: /data
      BUILTIN_SKILLS_DIR: /app/skills
      USER_SKILLS_DIR: /data/skills
      BUILTIN_COMMANDS_DIR: /app/commands
      USER_COMMANDS_DIR: /data/commands
      BUILTIN_PLUGINS_DIR: /app/plugins
      npm_config_cache: /data/cache/npm
      UV_CACHE_DIR: /data/cache/uv
      UV_TOOL_DIR: /data/cache/uv-tools
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8788}:8788"
      - "127.0.0.1:${PORT:-8787}:8787"
    volumes:
      - ${DATA_VOLUME:-./data}:/data
      - ${PROJECTS_DIR:?Set PROJECTS_DIR in .env}:${PROJECTS_DIR:?Set PROJECTS_DIR in .env}
      - ${HOME}/.gitconfig:/home/app/.gitconfig:ro
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    depends_on:
      mcp:
        condition: service_healthy
    command: ["tunnel", "--metrics", "0.0.0.0:2000", "--url", "http://mcp:8787"]
    restart: unless-stopped

  named-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [named-tunnel]
    depends_on:
      mcp:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: ["tunnel", "run"]
    restart: unless-stopped
